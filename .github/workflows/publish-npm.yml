name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - coptic-antonios-unicode
          - coptic-pronounce
          - coptic-readings
          - bible-citation-text
  push:
    tags:
      - v*

jobs:
  publish:
    if: >-
      github.event_name == 'push' ||
      inputs.package == 'all' ||
      inputs.package == matrix.package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - coptic-antonios-unicode
          - coptic-pronounce
          - coptic-readings
          - bible-citation-text
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      # npm 11 rejects always-auth; setup-node still writes it into NPM_CONFIG_USERCONFIG.
      - name: Drop deprecated always-auth from npmrc
        run: |
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/always-auth/d' "$NPM_CONFIG_USERCONFIG"
          fi

      - name: Install and build
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --ignore-scripts --provenance=false
