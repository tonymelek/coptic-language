name: Publish shell artifacts

# Builds the /language/ and /readings/ artifacts for coptic-world.com.
# Upload + notify are paused until coptic-world-shell is ready.
#
# When re-enabling:
#   Add SHELL_DISPATCH_TOKEN secret (fine-grained PAT, contents:write on
#   tonymelek/coptic-world-shell).
# The shell-artifacts release is created by this workflow if it is missing.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Build shell artifacts
        run: node scripts/build-shell-artifact.mjs

